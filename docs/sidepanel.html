<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Standup queue</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="https://www.gstatic.com/meetjs/addons/1.2.0/meet.addons.js"></script>
    <script type="module" src="sidepanel.js"></script>
  </head>
  <body>
    <main class="panel">
      <section class="speaking" aria-live="polite">
        <p class="label">Now speaking</p>
        <div class="speaking-row">
          <p id="speaking-name" class="speaking-name"></p>
          <button id="next" class="primary">Next</button>
        </div>
        <button id="skip" class="link small">Skip for now</button>
      </section>

      <section>
        <div class="section-head">
          <p class="label">Up next <span id="waiting-count"></span></p>
          <button id="shuffle" class="link small">Shuffle</button>
        </div>
        <ol id="waiting" class="queue"></ol>
        <p id="waiting-empty" class="muted small-text" hidden>Nobody waiting.</p>
      </section>

      <section class="join">
        <form id="join-form" class="row">
          <input id="my-name" placeholder="Your name" maxlength="40" autocomplete="name" aria-label="Your name" />
          <button class="primary" type="submit">Join</button>
        </form>
        <div id="joined" class="row" hidden>
          <p id="joined-text" class="grow"></p>
          <button id="leave" class="link small">Leave</button>
        </div>
      </section>

      <footer class="footer">
        <p id="done-count" class="muted small-text"></p>
        <div class="row">
          <button id="show-add" class="link small">Add someone</button>
          <button id="invite" class="link small" hidden>Invite everyone</button>
          <button id="reset" class="link small danger">Clear</button>
        </div>
        <form id="add-form" class="row" hidden>
          <input id="other-name" placeholder="Their name" maxlength="40" aria-label="Name of someone else to add" />
          <button type="submit">Add</button>
        </form>
        <p id="status" class="muted small-text" role="status"></p>
      </footer>
    </main>
  </body>
</html>
